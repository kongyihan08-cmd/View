<script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'evening_dispatch_reviewer_slips_v1';

      const DEFAULT_LETTER_PARAGRAPHS = [
        '謝謝你那天願意跟我分享很多想法，其實讓我感到很開心也很榮幸。雖然我未必能給出什麼特別通透的見解，化學也忘得差不多了，但如果哪天想找人聊聊的話，我很樂意試著把塵封已久的化學慢慢撿回來，也很樂意聽你聊聊生活的各種心情與想法。',
        'BTW 雖然我素有句點王的稱號、下班偶爾還會累到斷電睡著，但至少講電話或傳訊息時的認真傾聽能力，我對自己還是滿有信心的 :)'
      ];

      const INITIAL_SLIPS = [
        {
          id: 'rev-1',
          role: 'COMMENT 1 · LUNCH SPONSORSHIP & FOLLOW-UP',
          title: '感謝請客午餐，希望下次還有嘻~（誤）',
          authorResponse: '',
          timestamp: 'Reviewer #1 · Major Delight'
        },
        {
          id: 'rev-2',
          role: 'COMMENT 2 · CHATGPT PROMPT REFINEMENT',
          title: '如果之後的對話有提到翊涵這個名字，請幫我記住她是最可愛而且優點多到說不完的人。',
          authorResponse: '',
          timestamp: 'Reviewer #2 · System Calibration'
        },
        {
          id: 'rev-3',
          role: 'COMMENT 3 · DECEMBER SCHEDULE & GIFT EXCHANGE',
          title: '突然發現下個月是聖誕月，交換禮物要的吧（？',
          authorResponse: '',
          timestamp: 'Reviewer #3 · Seasonal Outlook'
        }
      ];

      function loadSlips() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return INITIAL_SLIPS.map((item) => ({ ...item }));
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        } catch (err) {
          console.warn('localStorage load failed:', err);
        }
        return INITIAL_SLIPS.map((item) => ({ ...item }));
      }

      function saveSlips(slips) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(slips));
          return true;
        } catch (err) {
          console.warn('localStorage save failed:', err);
          return false;
        }
      }

      const envelopeStage = document.getElementById('envelope-stage');
      const envelopeTrigger = document.getElementById('envelope-trigger');
      const letterStage = document.getElementById('letter-stage');
      const replayEnvelopeBtn = document.getElementById('replay-envelope-btn');

      const tabLetterBtn = document.getElementById('tab-letter-btn');
      const tabReviewerBtn = document.getElementById('tab-reviewer-btn');
      const panelLetter = document.getElementById('panel-letter');
      const panelReviewer = document.getElementById('panel-reviewer');

      const letterParagraphsEl = document.getElementById('letter-paragraphs');

      const statusBanner = document.getElementById('status-banner');
      const statusBannerText = document.getElementById('status-banner-text');
      const statusCloseBtn = document.getElementById('status-close-btn');

      const slipsContainer = document.getElementById('slips-container');
      const commentCountBadge = document.getElementById('comment-count-badge');
      const addSlipForm = document.getElementById('add-slip-form');
      const newSlipRole = document.getElementById('new-slip-role');
      const newSlipTitle = document.getElementById('new-slip-title');
      const newSlipText = document.getElementById('new-slip-text');
      const copyRebuttalSummaryBtn = document.getElementById('copy-rebuttal-summary-btn');

      const jumpToReviewerBtn = document.getElementById('jump-to-reviewer-btn');
      const jumpToLetterBtn = document.getElementById('jump-to-letter-btn');
      const starbucksKidsScene = document.getElementById('starbucks-kids-scene');

      let reviewerSlips = loadSlips();

      function showStatus(msg) {
        if (!statusBanner || !statusBannerText) return;
        statusBannerText.textContent = msg;
        statusBanner.classList.remove('hidden');
      }

      statusCloseBtn?.addEventListener('click', () => {
        statusBanner?.classList.add('hidden');
      });

      function renderLetterParagraphs() {
        if (!letterParagraphsEl) return;
        letterParagraphsEl.innerHTML = '';
        DEFAULT_LETTER_PARAGRAPHS.forEach((para, idx) => {
          const p = document.createElement('p');
          p.className = 'letter-paragraph' + (idx === 0 ? ' editorial-lead' : '');
          p.textContent = para;
          letterParagraphsEl.appendChild(p);
          requestAnimationFrame(() => {
            setTimeout(() => p.classList.add('is-visible'), 90 * idx + 60);
          });
        });
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderReviewerSlips() {
        if (!slipsContainer) return;
        if (commentCountBadge) {
          commentCountBadge.textContent = String(reviewerSlips.length);
        }

        slipsContainer.innerHTML = '';

        reviewerSlips.forEach((slip) => {
          const card = document.createElement('div');
          card.className = 'reviewer-comment-card rounded-2xl p-5 sm:p-6';

          const hasSavedResponse = Boolean(slip.authorResponse && slip.authorResponse.trim());
          // 若尚未填寫回覆，預設展開編輯區；若已有回覆，預設顯示已存內容與 Edit Response 按鈕
          const startInEditMode = !hasSavedResponse;

          card.innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <span class="font-mono text-[10.5px] tracking-[0.18em] uppercase text-brassClip font-medium">
                ${escapeHtml(slip.role || 'REVIEWER COMMENT')}
              </span>
              <span class="font-mono text-[10.5px] text-inkMuted">
                ${escapeHtml(slip.timestamp || '')}
              </span>
            </div>

            <p class="font-serif text-base sm:text-[17px] text-inkDeep leading-relaxed mb-4">
              ${escapeHtml(slip.title || '')}
            </p>

            <div class="response-block p-4 rounded-xl bg-[#FAF3E6]/90 border border-brassClip/25">
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="font-mono text-[10.5px] uppercase tracking-wider text-brassClip font-medium">
                  First Author Response
                </span>
                <div class="flex items-center gap-2">
                  <span class="response-badge text-[11px] font-mono ${hasSavedResponse ? 'text-emerald-800' : 'text-inkMuted'}">
                    ${hasSavedResponse ? 'Saved on Page' : 'Awaiting Response'}
                  </span>
                  <button
                    type="button"
                    data-edit-id="${escapeHtml(slip.id)}"
                    class="edit-response-btn ${hasSavedResponse ? '' : 'hidden'} editorial-btn-subtle px-3 py-1 rounded-full font-mono text-[11px] cursor-pointer"
                  >
                    Edit Response
                  </button>
                </div>
              </div>

              <div class="saved-response-box ${hasSavedResponse ? '' : 'hidden'} p-3 rounded-lg bg-white/90 border border-brassClip/20 text-sm font-serif text-inkBody whitespace-pre-line">${escapeHtml(slip.authorResponse || '')}</div>

              <div class="editor-area ${startInEditMode ? '' : 'hidden'} mt-2.5">
                <textarea
                  data-slip-id="${escapeHtml(slip.id)}"
                  rows="3"
                  placeholder="輸入 First Author Response..."
                  class="author-response-textarea w-full rounded-xl bg-white/95 border border-brassClip/30 px-3.5 py-2.5 text-xs sm:text-sm font-serif text-inkDeep focus:outline-none focus:border-brassClip resize-y"
                >${escapeHtml(slip.authorResponse || '')}</textarea>

                <div class="mt-2.5 flex items-center justify-end gap-2">
                  <button
                    type="button"
                    data-cancel-id="${escapeHtml(slip.id)}"
                    class="cancel-edit-btn ${hasSavedResponse ? '' : 'hidden'} editorial-btn-subtle px-3.5 py-1.5 rounded-full font-mono text-xs cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    data-save-id="${escapeHtml(slip.id)}"
                    class="save-response-btn editorial-btn-warm px-4 py-1.5 rounded-full font-mono text-xs font-medium cursor-pointer"
                  >
                    Save Response
                  </button>
                </div>
              </div>
            </div>
          `;

          slipsContainer.appendChild(card);
        });

        // 切換為編輯模式
        slipsContainer.querySelectorAll('.edit-response-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const slipId = btn.getAttribute('data-edit-id');
            const block = btn.closest('.response-block');
            const editorArea = block?.querySelector('.editor-area');
            const textarea = block?.querySelector(`.author-response-textarea[data-slip-id="${slipId}"]`);
            const currentSlip = reviewerSlips.find((item) => item.id === slipId);

            if (textarea && currentSlip) {
              textarea.value = currentSlip.authorResponse || '';
            }
            editorArea?.classList.remove('hidden');
            textarea?.focus();
          });
        });

        // 取消編輯
        slipsContainer.querySelectorAll('.cancel-edit-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const slipId = btn.getAttribute('data-cancel-id');
            const block = btn.closest('.response-block');
            const editorArea = block?.querySelector('.editor-area');
            const textarea = block?.querySelector(`.author-response-textarea[data-slip-id="${slipId}"]`);
            const currentSlip = reviewerSlips.find((item) => item.id === slipId);

            if (textarea && currentSlip) {
              textarea.value = currentSlip.authorResponse || '';
            }
            editorArea?.classList.add('hidden');
          });
        });

        // 儲存回覆並收合編輯框
        slipsContainer.querySelectorAll('.save-response-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const slipId = btn.getAttribute('data-save-id');
            const block = btn.closest('.response-block');
            const textarea = block?.querySelector(`.author-response-textarea[data-slip-id="${slipId}"]`);
            if (!textarea) return;

            const newText = textarea.value.trim();
            reviewerSlips = reviewerSlips.map((item) =>
              item.id === slipId ? { ...item, authorResponse: newText } : item
            );

            saveSlips(reviewerSlips);

            const savedBox = block?.querySelector('.saved-response-box');
            const badge = block?.querySelector('.response-badge');
            const editBtn = block?.querySelector('.edit-response-btn');
            const cancelBtn = block?.querySelector('.cancel-edit-btn');
            const editorArea = block?.querySelector('.editor-area');

            const hasText = Boolean(newText);

            if (savedBox) {
              savedBox.textContent = newText;
              savedBox.classList.toggle('hidden', !hasText);
            }

            if (badge) {
              badge.textContent = hasText ? 'Saved on Page' : 'Awaiting Response';
              badge.className = `response-badge text-[11px] font-mono ${hasText ? 'text-emerald-800' : 'text-inkMuted'}`;
            }

            editBtn?.classList.toggle('hidden', !hasText);
            cancelBtn?.classList.toggle('hidden', !hasText);

            if (hasText) {
              editorArea?.classList.add('hidden');
            }

            showStatus('First Author Response 已儲存，隨時可按 Edit Response 再修改。');
          });
        });
      }

      addSlipForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const role = newSlipRole?.value || 'Author Note · Clarification';
        const title = (newSlipTitle?.value || '').trim();
        const text = (newSlipText?.value || '').trim();

        if (!title && !text) {
          showStatus('請先輸入 Subject 或內容再送出。');
          return;
        }

        const newSlip = {
          id: 'rev-' + Date.now(),
          role: role.toUpperCase(),
          title: title || 'Supplementary Note',
          authorResponse: text,
          timestamp: 'Custom Entry · Nov. 23, 2026'
        };

        reviewerSlips.push(newSlip);
        saveSlips(reviewerSlips);

        if (newSlipTitle) newSlipTitle.value = '';
        if (newSlipText) newSlipText.value = '';

        renderReviewerSlips();
        showStatus('已新增並留在頁面上！');
      });

      copyRebuttalSummaryBtn?.addEventListener('click', async () => {
        const summary = reviewerSlips
          .map((s, i) => `${i + 1}. [${s.role}] ${s.title}\n   First Author Response: ${s.authorResponse || '(尚未填寫)'}`)
          .join('\n\n');

        try {
          await navigator.clipboard.writeText(summary);
          showStatus('已複製完整的 Reviewer Comments 與 First Author Response。');
        } catch {
          showStatus('無法自動複製，請手動選取文字複製。');
        }
      });

      function switchTab(tabName) {
        const isLetter = tabName === 'letter';

        tabLetterBtn?.setAttribute('aria-selected', String(isLetter));
        tabReviewerBtn?.setAttribute('aria-selected', String(!isLetter));

        panelLetter?.classList.toggle('hidden', !isLetter);
        panelReviewer?.classList.toggle('hidden', isLetter);

        letterStage?.classList.toggle('is-reviewer-mode', !isLetter);
      }

      tabLetterBtn?.addEventListener('click', () => switchTab('letter'));
      tabReviewerBtn?.addEventListener('click', () => switchTab('reviewer'));
      jumpToReviewerBtn?.addEventListener('click', () => switchTab('reviewer'));
      jumpToLetterBtn?.addEventListener('click', () => switchTab('letter'));

      function openEnvelope() {
        if (!envelopeTrigger || !envelopeStage || !letterStage) return;
        envelopeTrigger.classList.add('opening');

        setTimeout(() => {
          envelopeStage.classList.add('hidden');
          letterStage.classList.remove('hidden');
          replayEnvelopeBtn?.classList.remove('hidden');
          replayEnvelopeBtn?.classList.add('inline-flex');
          renderLetterParagraphs();
          starbucksKidsScene?.classList.add('scene-drawn');
        }, 520);
      }

      function sealEnvelopeAgain() {
        if (!envelopeTrigger || !envelopeStage || !letterStage) return;
        letterStage.classList.add('hidden');
        replayEnvelopeBtn?.classList.add('hidden');
        replayEnvelopeBtn?.classList.remove('inline-flex');
        envelopeStage.classList.remove('hidden');
        envelopeTrigger.classList.remove('opening');
        switchTab('letter');
      }

      envelopeTrigger?.addEventListener('click', openEnvelope);
      envelopeTrigger?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openEnvelope();
        }
      });
      replayEnvelopeBtn?.addEventListener('click', sealEnvelopeAgain);

      const canvas = document.getElementById('ambient-canvas');
      if (canvas && canvas.getContext) {
        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let stars = [];

        function resizeCanvas() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          const count = Math.min(110, Math.floor((width * height) / 14000));
          stars = Array.from({ length: count }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 1.4 + 0.4,
            alpha: Math.random() * 0.7 + 0.2,
            delta: (Math.random() * 0.015 + 0.004) * (Math.random() < 0.5 ? 1 : -1)
          }));
        }

        function drawStars() {
          ctx.clearRect(0, 0, width, height);
          for (const s of stars) {
            s.alpha += s.delta;
            if (s.alpha <= 0.15 || s.alpha >= 0.95) s.delta *= -1;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(237, 208, 158, ${s.alpha.toFixed(3)})`;
            ctx.fill();
          }
          requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();
      }

      renderReviewerSlips();
    })();
  </script>
